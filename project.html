<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EZA Design — Project Details</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <div class="logo-mark"><span>E</span></div>
      <div class="logo-copy">
        <div class="logo-main">EZA</div>
        <div class="logo-sub">Design Studio</div>
      </div>
      <div class="brand-divider"></div>
      <div class="brand-main">
        <h1>EZA Design</h1>
        <p>Project Brain for Shoprite Checkers</p>
      </div>
    </div>
    <div class="topbar__user" id="topbarUserInfo">
      <div>
        <div class="user__name" id="topbarUserName">Guest</div>
        <div class="user__role" id="topbarUserRole">Please sign in</div>
      </div>
      <button class="btn btn-secondary hidden" id="logoutBtn">Log out</button>
      <div class="save-indicator hidden" id="saveIndicator">Saved ✓</div>
    </div>
  </header>

  <main class="page">
    <section class="card detail-view" id="detailView">

      <div class="detail-nav">
        <button class="btn nav-btn" id="backToDashboard">← Back to Dashboard</button>
        <button class="btn nav-btn" id="prevProjectBtn">← Previous Project</button>
        <button class="btn nav-btn" id="nextProjectBtn">Next Project →</button>
      </div>

      <!-- Edit bar -->
      <div class="edit-bar" id="editBar">
        <div class="edit-bar__left">
          <h2 id="editBarTitle"></h2>
          <span id="editBarMeta"></span>
        </div>
        <div class="edit-bar__right">
          <button class="btn btn-primary" id="editBtn">✏️ Edit Project</button>
          <button class="btn btn-primary hidden" id="saveBtn">💾 Save Changes</button>
          <button class="btn btn-secondary hidden" id="cancelBtn">Cancel</button>
        </div>
      </div>

      <!-- Page content rendered by JS -->
      <div id="projectContent"></div>

    </section>
  </main>

  <script type="module" src="detail.js"></script>
</body>
</html>
